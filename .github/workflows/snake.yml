name: Generate Snake Animation

on:
  schedule:
    - cron: "0 3 * * *" # roda todo dia às 03:00 UTC
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300C9A7&color_dots=%23eef0ff,%23c7d2fe,%2393a5fd,%236C63FF,%234b3fd6
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2300C9A7&color_dots=%23161b22,%23123c3a,%2300C9A7,%235f7fea,%236C63FF

      - name: Push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
